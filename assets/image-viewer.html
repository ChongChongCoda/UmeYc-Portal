<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #171a21; color: #fff; font: 14px sans-serif; }
  header { position: sticky; top: 0; height: 34px; display: flex; align-items: center; gap: 4px; padding: 2px 6px; background: #252b35; z-index: 1; }
  header span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  button { min-width: 32px; height: 28px; border: 0; border-radius: 4px; background: #435268; color: white; font-size: 14px; }
  button:focus-visible { outline: 2px solid #80cfff; }
  main { height: calc(100vh - 34px); overflow: auto; overscroll-behavior: contain; }
  img { display: block; width: 100%; height: auto; max-width: none; }
  #error { display: none; padding: 16px; }
</style>
<header>
  <span>{{TITLE}}</span>
  <button id="smaller" aria-label="缩小">−</button>
  <button id="fit" aria-label="适合宽度">适宽</button>
  <button id="larger" aria-label="放大">＋</button>
</header>
<main><img id="guide" src="{{IMAGE_URL}}" alt="{{TITLE}}"><p id="error">图片无法读取，请检查 SD 卡后重新选择文件。</p></main>
<script>
  const image = document.getElementById('guide');
  let scale = 1;
  function zoom(value) {
    scale = Math.min(8, Math.max(0.25, value));
    image.style.width = (scale * 100) + '%';
  }
  document.getElementById('smaller').onclick = () => zoom(scale / 1.4);
  document.getElementById('larger').onclick = () => zoom(scale * 1.4);
  document.getElementById('fit').onclick = () => zoom(1);
  image.onerror = () => { image.hidden = true; document.getElementById('error').style.display = 'block'; };
</script>
</html>
