<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="same-origin">
<title>Portal · 扫码输入网址</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 48px 20px; background: #171a21; color: #fff; font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 480px; margin: auto; }
  h1 { font-size: 26px; margin: 0 0 10px; }
  p { color: #bcc6d4; }
  label { display: block; margin-bottom: 8px; }
  input { display: block; width: 100%; padding: 14px; border: 1px solid #58667a; border-radius: 8px; background: #252b35; color: #fff; font: inherit; }
  input:focus { outline: 2px solid #80cfff; }
  button { width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 8px; background: #1a9fff; color: #fff; font: inherit; font-weight: 600; }
  #message { color: #80cfff; }
  small { display: block; margin-top: 24px; color: #9aa8ba; }
</style>
<main>
  <h1>扫码输入网址</h1>
  <p>填写攻略网页或图片地址，发送后会在 Steam Deck 的 Portal 中打开。</p>
  <p id="message" role="status">{{MESSAGE}}</p>
  <form method="post" style="display: {{FORM_DISPLAY}}">
    <label for="url">网址</label>
    <input id="url" name="url" type="text" inputmode="url" autocomplete="url" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="4096" placeholder="https://example.com/guide" required>
    <button type="submit">发送到 Deck</button>
  </form>
  <small>请保持 Deck 上的扫码窗口打开。二维码 5 分钟内有效，每次只能发送一个网址。</small>
</main>
</html>
